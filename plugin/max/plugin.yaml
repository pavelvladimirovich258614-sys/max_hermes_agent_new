name: max-platform
label: MAX
kind: platform
version: 0.1.0
description: >
  Gateway-адаптер мессенджера MAX (max.ru) для Hermes Agent.
  MVP шаг 1: проверка токена через GET /me, без обработки сообщений.
author: Pavel / Hermes Agent
requires_env:
  - name: MAX_BOT_TOKEN
    description: "Токен бота MAX, выданный @metabot на max.ru (Authorization: <token>, без префикса Bearer)"
    prompt: "Токен бота MAX"
    password: true
optional_env:
  - name: MAX_API_BASE
    description: "Базовый URL API платформы MAX (по умолчанию: https://platform-api.max.ru)"
    prompt: "MAX API base"
    password: false
  - name: MAX_HOME_CHANNEL
    description: "chat_id по умолчанию для доставки cron / уведомлений"
    prompt: "Домашний chat_id (или пусто)"
    password: false
  - name: MAX_ALLOWED_USERS
    description: "Список MAX user_id через запятую — кому разрешено писать боту (post-MVP)"
    prompt: "Разрешённые user_id (через запятую)"
    password: false
  - name: MAX_ALLOW_ALL_USERS
    description: "Разрешить любому пользователю MAX писать боту (только для разработки)"
    prompt: "Разрешить всех пользователей? (true/false)"
    password: false
