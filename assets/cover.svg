<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg)" rx="12"/>
  <!-- Grid lines -->
  <g opacity="0.08" stroke="#00d4ff" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
  </g>
  <!-- Channel diagram -->
  <g filter="url(#neon)">
    <rect x="60" y="150" width="130" height="50" rx="8" fill="none" stroke="#00d4ff" stroke-width="2"/>
    <text x="125" y="180" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="14">MAX User</text>
    <rect x="290" y="150" width="130" height="50" rx="8" fill="none" stroke="#00d4ff" stroke-width="2"/>
    <text x="355" y="180" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="14">MaxAdapter</text>
    <rect x="520" y="130" width="140" height="90" rx="8" fill="none" stroke="#7b2ff7" stroke-width="2"/>
    <text x="590" y="165" text-anchor="middle" fill="#c4a0ff" font-family="monospace" font-size="13">Hermes</text>
    <text x="590" y="185" text-anchor="middle" fill="#c4a0ff" font-family="monospace" font-size="13">Gateway</text>
    <text x="590" y="205" text-anchor="middle" fill="#c4a0ff" font-family="monospace" font-size="11">Runner</text>
    <line x1="190" y1="175" x2="290" y2="175" stroke="#00d4ff" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="420" y1="175" x2="520" y2="175" stroke="#00d4ff" stroke-width="1.5"/>
  </g>
  <!-- Arrows -->
  <g fill="#00d4ff">
    <polygon points="288,170 280,175 288,180"/>
    <polygon points="518,170 510,175 518,180"/>
  </g>
  <!-- Tools/Skills branch -->
  <g filter="url(#neon)" opacity="0.7">
    <rect x="520" y="260" width="140" height="40" rx="6" fill="none" stroke="#00ff88" stroke-width="1"/>
    <text x="590" y="285" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="11">Tools / Skills / Browser</text>
    <line x1="590" y1="220" x2="590" y2="260" stroke="#00ff88" stroke-width="1"/>
  </g>
  <!-- Roles branch -->
  <g filter="url(#neon)" opacity="0.7">
    <rect x="290" y="260" width="130" height="40" rx="6" fill="none" stroke="#ffaa00" stroke-width="1"/>
    <text x="355" y="285" text-anchor="middle" fill="#ffaa00" font-family="monospace" font-size="11">Roles / Routes</text>
    <line x1="590" y1="250" x2="420" y2="270" stroke="#ffaa00" stroke-width="0.8" stroke-dasharray="4"/>
  </g>
  <!-- Title -->
  <text x="400" y="55" text-anchor="middle" fill="url(#glow)" font-family="Arial,sans-serif" font-size="32" font-weight="bold" filter="url(#neon)">MAX Hermes Agent</text>
  <text x="400" y="85" text-anchor="middle" fill="#8888cc" font-family="Arial,sans-serif" font-size="16">Full Hermes Gateway Channel for MAX Messenger</text>
  <!-- Bottom badge -->
  <text x="400" y="370" text-anchor="middle" fill="#555577" font-family="monospace" font-size="11">slash-commands · role-routes · tools · skills · team-add · progress · isolation</text>
</svg>
